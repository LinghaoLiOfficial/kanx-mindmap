name: Publish npm package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify release runtime
        run: |
          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          echo "Node.js $NODE_VERSION"
          echo "npm $NPM_VERSION"
          node - "$NPM_VERSION" <<'NODE'
          const current = process.argv[2].split('.').map(Number)
          const minimum = [11, 5, 1]
          let supported = true
          for (let index = 0; index < minimum.length; index += 1) {
            if (current[index] === minimum[index]) continue
            supported = current[index] > minimum[index]
            break
          }
          if (!supported) {
            console.error(`npm ${process.argv[2]} is too old for trusted publishing; expected >=11.5.1`)
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check package
        run: |
          pnpm prepublishOnly
          npm pack --dry-run --ignore-scripts --json

      - name: Publish package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            npm publish --ignore-scripts --access public --tag next
          else
            npm publish --ignore-scripts --access public --tag latest
          fi

      - name: Verify published package
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          MAX_ATTEMPTS=12
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --prefer-online --registry=https://registry.npmjs.org 2>/dev/null || true)"
            TAG_VERSION="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" --prefer-online --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ] && [ "$TAG_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is published with dist-tag $DIST_TAG"
              exit 0
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Registry verification attempt $ATTEMPT/$MAX_ATTEMPTS returned version '$PUBLISHED_VERSION' and dist-tag '$TAG_VERSION'; retrying in 30 seconds"
              sleep 30
            fi
          done

          echo "Registry verification failed for $PACKAGE_NAME@$PACKAGE_VERSION and dist-tag $DIST_TAG"
          exit 1
